name: Static Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_racknerd:
        description: Deploy the verified main build to RackNerd
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: static-verification-${{ github.ref }}
  # Do not interrupt activation between the HTTPS check and a possible rollback.
  cancel-in-progress: false

jobs:
  verify:
    name: Production static gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false
          version: 10.34.5

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          cache: pnpm
          node-version: 24.15.0

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static production gates
        run: pnpm verify

      - name: Confirm generated state is clean
        run: git diff --exit-code

      - name: Publish verified build to RackNerd
        if: >-
          github.ref == 'refs/heads/main' &&
          ((github.event_name == 'push' && vars.PAVP_DEPLOY_ENABLED == 'true') ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy_to_racknerd))
        env:
          DEPLOY_HOST: ${{ vars.PAVP_DEPLOY_HOST }}
          DEPLOY_ORIGIN: ${{ vars.PAVP_DEPLOY_ORIGIN }}
          DEPLOY_PORT: ${{ vars.PAVP_DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.PAVP_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.PAVP_DEPLOY_PRIVATE_KEY }}
        shell: bash
        run: bash scripts/deploy/publish-racknerd.sh
